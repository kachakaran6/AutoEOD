name: autoeod

services:
  # ── (Optional) PostgreSQL Database ──
  # If you deploy a separate PostgreSQL service in Coolify or use Neon/Supabase, you can comment this out.
  postgres:
    image: postgres:16-alpine
    container_name: autoeod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoeod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoeod}
      POSTGRES_DB: ${POSTGRES_DB:-autoeod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoeod} -d ${POSTGRES_DB:-autoeod}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - autoeod_network

  # ── (Optional) Redis Service ──
  # If you deploy a separate Redis service in Coolify or use Upstash, you can comment this out.
  redis:
    image: redis:7-alpine
    container_name: autoeod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - autoeod_network

  # ── Backend API & Background Worker ──
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: autoeod-backend:latest
    container_name: autoeod-api
    restart: unless-stopped
    command: npm start
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_CALLBACK_URL: ${ZOHO_CALLBACK_URL:-}
      ZOHO_OAUTH_DOMAIN: ${ZOHO_OAUTH_DOMAIN:-https://accounts.zoho.com}
      ZOHO_API_DOMAIN: ${ZOHO_API_DOMAIN:-https://mail.zoho.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-gpt-4o-mini}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-AutoEOD <reports@yourdomain.com>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - autoeod_network

  # ── Frontend Web Dashboard ──
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: autoeod-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - autoeod_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  autoeod_network:
    driver: bridge
