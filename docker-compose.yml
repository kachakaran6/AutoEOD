services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autoeod
      POSTGRES_PASSWORD: autoeod
      POSTGRES_DB: autoeod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoeod"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    command: npm start
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgres://autoeod:autoeod@postgres:5432/autoeod
      - REDIS_URL=redis://redis:6379
      # Add other API environment variables here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    command: npm run start:worker
    environment:
      - DATABASE_URL=postgres://autoeod:autoeod@postgres:5432/autoeod
      - REDIS_URL=redis://redis:6379
      # Add other worker environment variables here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
