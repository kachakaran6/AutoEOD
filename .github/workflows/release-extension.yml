name: Release AutoEOD Extension

on:
  push:
    tags:
      - "v*"
      - "extension-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.0.5 or leave empty to use current package version)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Extension Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine version & sync manifests
        shell: bash
        run: |
          set -euo pipefail

          # Determine release tag name and clean version
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF_NAME:-}" == v* ]] || [[ "${GITHUB_REF_NAME:-}" == extension-v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            EXT_VER=$(node -p "require('./apps/extension/package.json').version")
            RELEASE_TAG="v${EXT_VER}"
          fi

          VERSION="${RELEASE_TAG#extension-v}"
          VERSION="${VERSION#v}"

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "Packaging extension version: ${VERSION} (Tag: ${RELEASE_TAG})"

          # Sync version to apps/extension/package.json and apps/extension/public/manifest.json BEFORE building
          node -e "
            const fs = require('fs');
            const targetVer = process.env.VERSION;

            // 1. Update apps/extension/package.json
            const pkgPath = 'apps/extension/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = targetVer;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            console.log('✓ Synced ' + pkgPath + ' to version ' + targetVer);

            // 2. Update apps/extension/public/manifest.json
            const manifestPath = 'apps/extension/public/manifest.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = targetVer;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            console.log('✓ Synced ' + manifestPath + ' to version ' + targetVer);
          "

      - name: Build extension
        run: npm run build --workspace=apps/extension

      - name: Verify build and manifest version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "apps/extension/dist/manifest.json" ]; then
            echo "Error: apps/extension/dist/manifest.json was not generated by build." >&2
            exit 1
          fi

          DIST_VER=$(node -p "require('./apps/extension/dist/manifest.json').version")
          if [ "$DIST_VER" != "$VERSION" ]; then
            echo "Error: Built manifest version ($DIST_VER) does not match expected version ($VERSION)!" >&2
            exit 1
          fi
          echo "✓ Verified dist/manifest.json version matches release version: $DIST_VER"

      - name: Package extension and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          # Archive the dist directory contents (so manifest.json is at the root of the zip)
          (cd apps/extension/dist && zip -r "../../../release-artifacts/autoeod-extension-${VERSION}.zip" .)

          # Also create a stable unversioned copy for direct download links
          cp "release-artifacts/autoeod-extension-${VERSION}.zip" "release-artifacts/autoeod-extension.zip"

          # Calculate SHA-256 checksums
          (cd release-artifacts && sha256sum "autoeod-extension-${VERSION}.zip" > "autoeod-extension-${VERSION}.zip.sha256")
          (cd release-artifacts && sha256sum "autoeod-extension.zip" > "autoeod-extension.zip.sha256")

          echo "Release artifacts prepared:"
          ls -lh release-artifacts

      - name: Sync updated version files back to git branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="master"
          # Fetch target branch if available
          git fetch origin "$TARGET_BRANCH" || true

          # Check if origin has different version
          ORIGIN_PKG_VER=$(git show "origin/${TARGET_BRANCH}:apps/extension/package.json" 2>/dev/null | node -p "try { JSON.parse(require('fs').readFileSync(0, 'utf-8')).version } catch(e) { '' }" || echo "")

          if [ "$ORIGIN_PKG_VER" != "$VERSION" ]; then
            echo "Attempting to push version bump to $TARGET_BRANCH..."
            git checkout "$TARGET_BRANCH" || git checkout -b "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            git checkout "${GITHUB_SHA:-HEAD}" -- apps/extension/package.json apps/extension/public/manifest.json
            git add apps/extension/package.json apps/extension/public/manifest.json
            git commit -m "chore(extension): bump version to ${VERSION} [skip ci]" || echo "No changes to commit"
            git push origin "$TARGET_BRANCH" || echo "Branch push skipped (may have branch protections)"
          else
            echo "Branch $TARGET_BRANCH already matches version $VERSION."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AutoEOD Extension ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/autoeod-extension-${{ env.VERSION }}.zip
            release-artifacts/autoeod-extension-${{ env.VERSION }}.zip.sha256
            release-artifacts/autoeod-extension.zip
            release-artifacts/autoeod-extension.zip.sha256
