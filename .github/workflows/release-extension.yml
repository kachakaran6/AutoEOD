name: Release AutoEOD Extension

on:
  push:
    tags:
      - "v*"
      - "extension-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.0.5 or leave empty to use current package version)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Extension Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build --workspace=apps/extension

      - name: Package extension and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          # Determine release tag name and clean version
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF_NAME:-}" == v* ]] || [[ "${GITHUB_REF_NAME:-}" == extension-v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            EXT_VER=$(node -p "require('./apps/extension/package.json').version")
            RELEASE_TAG="v${EXT_VER}"
          fi

          VERSION="${RELEASE_TAG#extension-v}"
          VERSION="${VERSION#v}"

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "Packaging extension version: ${VERSION} (Tag: ${RELEASE_TAG})"

          # Sanity check build output
          if [ ! -f "apps/extension/dist/manifest.json" ]; then
            echo "Error: apps/extension/dist/manifest.json was not generated by build." >&2
            exit 1
          fi

          mkdir -p release-artifacts

          # Archive the dist directory contents (so manifest.json is at the root of the zip)
          (cd apps/extension/dist && zip -r "../../../release-artifacts/autoeod-extension-${VERSION}.zip" .)

          # Also create a stable unversioned copy for direct download links
          cp "release-artifacts/autoeod-extension-${VERSION}.zip" "release-artifacts/autoeod-extension.zip"

          # Calculate SHA-256 checksums
          (cd release-artifacts && sha256sum "autoeod-extension-${VERSION}.zip" > "autoeod-extension-${VERSION}.zip.sha256")
          (cd release-artifacts && sha256sum "autoeod-extension.zip" > "autoeod-extension.zip.sha256")

          echo "Release artifacts prepared:"
          ls -lh release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AutoEOD Extension ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/autoeod-extension-${{ env.VERSION }}.zip
            release-artifacts/autoeod-extension-${{ env.VERSION }}.zip.sha256
            release-artifacts/autoeod-extension.zip
            release-artifacts/autoeod-extension.zip.sha256
